name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/ci-tests.py python
  twins:
    name: Shell twins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify both interpreters and run both suites
        shell: bash
        run: |
          set -euo pipefail
          command -v sh
          pwsh -NoProfile -Command 'Write-Output "PowerShell ready"'
          python scripts/ci-tests.py twins
  required:
    name: CI required
    if: ${{ always() }}
    needs: [python, twins]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          TWINS_RESULT: ${{ needs.twins.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$TWINS_RESULT" = success
